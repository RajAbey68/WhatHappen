substitutions:
  _IMAGE_TAG: latest

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/whathappen/app:${_IMAGE_TAG}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=https://pomgvxdokjmxyfbgazls.supabase.co'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvbWd2eGRva2pteHlmYmdhemxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjU1OTAsImV4cCI6MjA5NjY0MTU5MH0.jnpG78rmOH1Dint18ForByuzH5y9rdBH9wX4kGs_slI'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=https://whathappen-116263110764.europe-west1.run.app'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/whathappen/app:${_IMAGE_TAG}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - whathappen
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/whathappen/app:${_IMAGE_TAG}'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=60'
      - '--allow-unauthenticated'
      # --set-secrets and --set-env-vars are gcloud DICTIONARY flags. Repeating
      # either one does not accumulate — the last occurrence replaces every
      # earlier one. As written before, this deploy would have shipped a
      # container with ONLY GCS_BUCKET and ONLY NEXT_PUBLIC_APP_URL set,
      # dropping SUPABASE_SERVICE_ROLE_KEY and DEEPSEEK_API_KEY, and dropping
      # the Supabase URL and anon key. lib/supabase.ts throws when those two are
      # absent, so the container would have failed to serve at all.
      #
      # Never caught because this config had never actually been run against
      # production: the service has been on revision 1 since 9 July, and
      # .github/workflows/deploy.yml only printed instructions instead of
      # deploying. One comma-separated value per flag.
      - '--set-secrets=DEEPSEEK_API_KEY=deepseek-api-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-key:latest,GCS_BUCKET=gcs-bucket-name:latest'
      - '--set-env-vars=NEXT_PUBLIC_SUPABASE_URL=https://pomgvxdokjmxyfbgazls.supabase.co,NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvbWd2eGRva2pteHlmYmdhemxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjU1OTAsImV4cCI6MjA5NjY0MTU5MH0.jnpG78rmOH1Dint18ForByuzH5y9rdBH9wX4kGs_slI,NEXT_PUBLIC_APP_URL=https://whathappen-116263110764.europe-west1.run.app'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/whathappen/app:${_IMAGE_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
