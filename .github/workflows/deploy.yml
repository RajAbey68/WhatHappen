# NOTE: despite the name, this workflow does NOT deploy. It builds and then
# prints instructions. Production is deployed by running, from a machine with
# gcloud authenticated against auto-research-001:
#
#   cd /Users/arajiv/GitHub/WhatHappen && gcloud builds submit --config cloudbuild.yaml
#
# The name has been left alone rather than quietly changed, because a workflow
# called "Deploy to Cloud Run" that goes green while deploying nothing is how
# production sat on revision 1 from 9 July while the branch went green over and
# over. Wiring a real deploy needs a GCP service-account secret on this repo,
# which does not exist yet — `gh secret list` is empty.
name: Deploy to Cloud Run

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # lib/supabase.ts throws without these (RAJ-748). This job only
          # verifies the build compiles; the image that actually ships is built
          # by Cloud Build, which injects the real values as --build-arg. See
          # the note below about what this workflow does and does not do.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only

      - name: Generate build info
        run: |
          echo "Build successful!"
          echo "To deploy to Cloud Run:"
          echo "1. Ensure your GCP_SA_KEY and GCP_PROJECT_ID GitHub Secrets are configured"
          echo "2. The Dockerfile and cloudbuild.yaml are ready for Cloud Build"
          echo "3. Trigger: gcloud builds submit --config cloudbuild.yaml"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7
