name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check || npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests
        env:
          WHATSAPP_PASSPHRASE_HASH: abf45d445e61702f2a7db962e13e37e8e29999c75a782671c377bd67070fa287

      - name: Check for secrets in code
        run: npx secretlint "**/*" --ignorePath .gitignore || true
