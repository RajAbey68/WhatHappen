name: Deploy to hermes-dev

on:
  push:
    branches: [main, fix/raj749-rls-blocker]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HERMES_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 167.233.236.178 >> ~/.ssh/known_hosts

      - name: Deploy to hermes-dev
        run: |
          ssh -i ~/.ssh/id_ed25519 root@167.233.236.178 << 'EOF'
          set -e
          cd /opt/services/whathappen
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}
          bash HERMES_DEPLOY.sh
          EOF

      - name: Run health checks
        run: |
          ssh -i ~/.ssh/id_ed25519 root@167.233.236.178 << 'EOF'
          echo "=== Verifying deployment ==="

          # Check container status
          if docker-compose ps whathappen | grep -q "Up"; then
            echo "✓ Container running"
          else
            echo "✗ Container not running"
            exit 1
          fi

          # Test HTTP endpoint
          if curl -s http://localhost:3000 > /dev/null; then
            echo "✓ HTTP endpoint responding"
          else
            echo "✗ HTTP endpoint not responding"
            exit 1
          fi

          # Test auth endpoint
          RESPONSE=$(curl -s "http://localhost:3000/api/auth/challenge?projectId=11111111-1111-4111-8111-111111111111")
          if echo "$RESPONSE" | grep -q "nonce\|error"; then
            echo "✓ Auth endpoint responding"
          else
            echo "✗ Auth endpoint not responding correctly"
            exit 1
          fi
          EOF

      - name: Report deployment status
        if: success()
        run: |
          echo "✅ Deployment successful to hermes-dev (167.233.236.178)"
          echo "App URL: https://whathappen.internal.hermes.local"
          echo "Local testing: http://localhost:3000 (via SSH)"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Report deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above for details."
          exit 1
